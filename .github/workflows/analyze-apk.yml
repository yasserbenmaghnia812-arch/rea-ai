name: Analyze Android APK

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Temporary signed Supabase download URL (keep private; expires in 1 hour)"
        required: true
        type: string
      project_id:
        description: "REA AI Studio project UUID"
        required: true
        type: string
      original_filename:
        description: "Original APK filename"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rea-apk-analysis-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate input
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Invalid project UUID"; exit 1; }
          [[ "$SOURCE_URL" == https://wrphphtelyuedntycbop.supabase.co/storage/v1/object/sign/apk-temp/* ]] || { echo "Source URL must be a signed URL from this project's private apk-temp bucket"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install analysis tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools output
          curl -fsSL -o tools/jadx-headless-mcp-0.7.1-all.jar https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar
          echo "6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  tools/jadx-headless-mcp-0.7.1-all.jar" | sha256sum -c -
          curl -fsSL -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar
          printf '#!/usr/bin/env bash\nexec java -jar "%s/tools/apktool.jar" "$@"\n' "$GITHUB_WORKSPACE" > tools/apktool
          chmod +x tools/apktool
          JADx_URL="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("jadx-.*\\.zip$")) | .browser_download_url' | head -n 1)"
          test -n "$JADx_URL"
          curl -fsSL "$JADx_URL" -o tools/jadx.zip
          unzip -q tools/jadx.zip -d tools/jadx
          npm install --global rea-agents@latest
          echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"
          echo "REA_JADX_MCP_JAR=$GITHUB_WORKSPACE/tools/jadx-headless-mcp-0.7.1-all.jar" >> "$GITHUB_ENV"
          echo "REA_APKTOOL_COMMAND=$GITHUB_WORKSPACE/tools/apktool" >> "$GITHUB_ENV"

      - name: Download private APK
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          ORIGINAL_FILENAME: ${{ inputs.original_filename }}
        run: |
          set -euo pipefail
          SAFE_NAME="$(basename "$ORIGINAL_FILENAME" | tr -cd 'A-Za-z0-9._-')"
          [[ "$SAFE_NAME" == *.apk ]] || { echo "Only APK input is supported by this workflow"; exit 1; }
          curl --fail --silent --show-error --location --retry 2 "$SOURCE_URL" -o "output/$SAFE_NAME"
          test -s "output/$SAFE_NAME"
          echo "APK_PATH=$GITHUB_WORKSPACE/output/$SAFE_NAME" >> "$GITHUB_ENV"
          sha256sum "output/$SAFE_NAME" > output/source.sha256

      - name: Decode resources and manifest with Apktool
        shell: bash
        run: |
          set -euo pipefail
          tools/apktool d --force --no-src "$APK_PATH" -o output/apktool
          rea decode-android-resources "$APK_PATH" --json > output/rea-apktool-evidence.json

      - name: Decompile Java and Kotlin sources with JADX
        shell: bash
        run: |
          set -euo pipefail
          JADX_BIN="$(find tools/jadx -type f -path '*/bin/jadx' | head -n 1)"
          test -x "$JADX_BIN"
          "$JADX_BIN" --threads-count 2 -d output/jadx "$APK_PATH"

      - name: Analyze APK with REA
        shell: bash
        run: |
          set -euo pipefail
          rea inspect-android-package "$APK_PATH" --json > output/rea-android-package-evidence.json
          rea search-android-classes "$APK_PATH" "" --json > output/rea-android-classes-evidence.json

      - name: Write analysis manifest
        shell: bash
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          ORIGINAL_FILENAME: ${{ inputs.original_filename }}
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("output/analysis-manifest.json",JSON.stringify({project_id:process.env.PROJECT_ID,original_filename:process.env.ORIGINAL_FILENAME,completed_at:new Date().toISOString(),tools:{rea:"rea-agents@latest",apktool:"3.0.2",jadx:"latest release",jadx_headless_mcp:"0.7.1"}},null,2))'

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: rea-analysis-${{ inputs.project_id }}
          path: output/
          if-no-files-found: error
          retention-days: 1
