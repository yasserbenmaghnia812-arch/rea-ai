name: Build Native Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'llama/**'
      - 'third_party/llama.cpp'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.gitmodules'
      - '.github/workflows/android-apk.yml'
    branches: [feat/native-android-apk]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android platform, NDK and CMake
        run: sdkmanager "platforms;android-35" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists and is non-empty
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REA-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
