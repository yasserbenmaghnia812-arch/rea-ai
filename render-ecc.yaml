services:
  - type: web
    name: yasser-ecc-mcp
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: ecc-mcp
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MCP_BEARER_TOKEN
        generateValue: true
      - key: ECC_ROOT
        value: /opt/ecc
