services:
  - type: web
    name: replica-mcp-server
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: replica-mcp
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MCP_BEARER_TOKEN
        generateValue: true
      - key: WORKSPACE_ROOT
        value: /tmp/replica-workspace

  - type: web
    name: yasser-ecc-mcp
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: ecc-mcp
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MCP_BEARER_TOKEN
        generateValue: true
      - key: ECC_ROOT
        value: /opt/ecc

  - type: web
    name: rea-cloud-mcp-unified
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: cloud-mcp
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MCP_BEARER_TOKEN
        generateValue: true
